[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studypal"
version = "0.1.0"
description = "StudyPal: a calm study tracker for exam season, as a regular desktop app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=6.2",
    "certifi>=2025.1",
    "desktop-notifier>=6.2; sys_platform != 'darwin'",
    "pypdfium2>=4.30",  # draws exam PDF pages as images for Groq, which can't read PDFs
    "pillow>=11",  # shrinks photos and pages to JPEG
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pyinstaller>=6.16"]

[project.gui-scripts]
studypal = "studypal.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studypal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
